backend-api-hosts: &backend-api-hosts
  - "http://localhost:8081"
  - "http://localhost:8082"
  - "http://localhost:8083"

backend-delivery-hosts: &backend-delivery-hosts
  - "http://localhost:8081"
  - "http://localhost:8082"
  - "http://localhost:8083"

routes:
  - name: "openapi.api"
    comment: "API"
    type: openapi
    endpoint: "/api"
    manifest: "../../docs/manifests/api.openapi.yaml"
    is_validation_enabled: false
    backend:
      hosts: *backend-api-hosts
      ssl:
        isEnabled: false

  - name: "openapi.delivery"
    comment: "DELIVERY API"
    type: openapi
    endpoint: "/delivery"
    manifest: "../../docs/manifests/delivery.openapi.yaml"
    is_validation_enabled: false
    backend:
      hosts: *backend-delivery-hosts
      ssl:
        isEnabled: false
