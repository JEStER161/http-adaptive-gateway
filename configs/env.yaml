# Режим работы приложения. Допустимые значения: dev, prod.
mode: dev

# Настройки структурированного логирования.
logging:
  # Минимальный уровень сообщений: DEBUG, INFO, WARN или ERROR.
  level: INFO
  # Gateway поддерживает JSON-кодирование логов.
  encoding: json
  # Имя HTTP-заголовка, через который принимается и передаётся идентификатор запроса.
  requestIDFieldName: x-request-id
  # Имя приложения, добавляемое в каждую запись лога.
  applicationName: adaptive-routing-gateway

# Настройки входящего HTTP-сервера Gateway.
listen:
  http:
    # HTTP-интерфейс должен быть включён для запуска приложения.
    isEnabled: true
    # 0.0.0.0 разрешает принимать подключения на всех сетевых интерфейсах.
    host: 0.0.0.0
    # Порт, на котором Gateway принимает клиентские запросы.
    port: 8080
    # Максимальное время чтения HTTP-заголовков клиента.
    readHeaderTimeout: 5s
    # Максимальное время чтения всего входящего запроса.
    readTimeout: 15s
    # Максимальное время формирования и отправки ответа клиенту.
    writeTimeout: 15s
    # Время жизни неактивного keep-alive соединения клиента.
    idleTimeout: 60s
    # Максимальное время graceful shutdown после SIGINT или SIGTERM.
    shutdownTimeout: 10s

# Настройки исходящих соединений Gateway с backend-репликами.
proxy:
  # Максимальное время установки TCP-соединения с backend.
  dialTimeout: 3s
  # Максимальное ожидание заголовков ответа после отправки запроса backend.
  responseHeaderTimeout: 10s
  # Время жизни неактивного keep-alive соединения с backend.
  idleConnTimeout: 60s
  # Максимальное суммарное число неактивных соединений в общем HTTP transport.
  maxIdleConns: 100
  # Максимальное число неактивных соединений с одной backend-репликой.
  maxIdleConnsPerHost: 20

application:
  # Список файлов с сервисами, их selector-prefix, manifest и backend hosts.
  # Относительные пути вычисляются от каталога, в котором находится этот файл.
  routeConfigPaths:
    - routes/services.yaml

  # Глобальные плагины Gateway. Сейчас должен быть указан ровно один balancer.
  # Его стратегия и параметры одинаковы для всех подключённых сервисов, однако
  # runtime-состояние (счётчики, in-flight и hash ring) создаётся для каждого
  # сервиса отдельно.
  routePluginsGlobal:
    - name: balancer
      # Manifest подключает этот плагин по alias и обязан ставить его последним.
      alias: gateway-balancer
      params:
        # Активная стратегия выбора реплики:
        # round_robin, random, least_connections или consistent_hash.
        # Значение adaptive зарезервировано, но сама стратегия пока не реализована.
        strategy: round_robin

        # Параметры стратегии random.
        random:
          # Фиксированное ненулевое значение делает последовательность
          # воспроизводимой. При 0 seed генерируется безопасным случайным образом.
          seed: 0

        # Параметры стратегии least_connections.
        leastConnections:
          # При одинаковом количестве активных запросов реплики выбираются по кругу.
          tieBreaker: round_robin

        # Параметры стратегии consistent_hash.
        consistentHash:
          # Количество виртуальных узлов на одну реплику в hash ring.
          # Большее значение улучшает равномерность ценой дополнительной памяти.
          virtualNodes: 128
          key:
            # Источник ключа: header или remote_ip.
            source: header
            # Заголовок используется только при source: header.
            name: X-Routing-Key
            # Если заголовок отсутствует, ключом становится IP клиента.
            fallback: remote_ip

        # Параметры будущей адаптивной стратегии. Они валидируются уже сейчас,
        # но начнут влиять на выбор реплики после реализации adaptive balancer.
        adaptive:
          # Интервал статистики, учитываемый при оценке состояния реплик.
          observationWindow: 30s
          # Минимальное число наблюдений до использования рассчитанной оценки.
          minSamples: 20
          # Доля запросов для исследования неочевидных или новых реплик.
          explorationRate: 0.05
          # Набор метрик итоговой оценки. Сумма weight должна быть равна 1.
          metrics:
            # Сглаженная задержка ответа реплики.
            - type: latency_ewma
              weight: 0.45
              params:
                # Коэффициент EWMA: большие значения сильнее учитывают новые запросы.
                alpha: 0.2
                # Целевая задержка, относительно которой нормализуется метрика.
                target: 200ms
            # Доля завершившихся ошибкой upstream-запросов.
            - type: error_rate
              weight: 0.40
              params:
                # Допустимая доля ошибок: 0.05 соответствует 5%.
                threshold: 0.05
            # Текущее число выполняющихся запросов к реплике.
            - type: inflight
              weight: 0.15
              params:
                # Нагрузка, после которой метрика должна заметно снижать приоритет.
                softLimit: 100
