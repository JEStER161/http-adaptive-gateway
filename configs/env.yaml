mode: dev

logging:
  level: INFO
  encoding: json
  requestIDFieldName: x-request-id
  applicationName: adaptive-routing-gateway

listen:
  http:
    isEnabled: true
    host: 0.0.0.0
    port: 8080
    readHeaderTimeout: 5s
    readTimeout: 15s
    writeTimeout: 15s
    idleTimeout: 60s
    shutdownTimeout: 10s

proxy:
  dialTimeout: 3s
  responseHeaderTimeout: 10s
  idleConnTimeout: 60s
  maxIdleConns: 100
  maxIdleConnsPerHost: 20

application:
  routeConfigPaths:
    - routes/services.yaml
  routePluginsGlobal:
    - name: balancer
      alias: gateway-balancer
      params:
        strategy: round_robin
        random:
          seed: 0
        leastConnections:
          tieBreaker: round_robin
        consistentHash:
          virtualNodes: 128
          key:
            source: header
            name: X-Routing-Key
            fallback: remote_ip
        adaptive:
          observationWindow: 30s
          minSamples: 20
          explorationRate: 0.05
          metrics:
            - type: latency_ewma
              weight: 0.45
              params:
                alpha: 0.2
                target: 200ms
            - type: error_rate
              weight: 0.40
              params:
                threshold: 0.05
            - type: inflight
              weight: 0.15
              params:
                softLimit: 100
